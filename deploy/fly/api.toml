# The API that holds the scans. Deploy from the repository root:
#
#   fly deploy --config deploy/fly/api.toml --dockerfile Dockerfile .
#
# One machine, one volume, and no autostop. The API runs a background worker
# that reconstructs a room minutes after the upload connection has closed, and
# a machine stopped for idleness would be stopped in the middle of that. The
# database is SQLite on the volume, so a second machine would be a second
# database: keep the count at one.
app = "standardphysics-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "api"

[env]
  SP_DATA_DIR = "/data"
  SP_API_PORT = "8787"
  # Fly's private network is IPv6. Binding :: accepts both families, so the
  # workspace can reach this app at standardphysics-api.internal.
  SP_API_HOST = "::"

[deploy]
  # Rolling would want a second machine, and only one may hold the volume.
  strategy = "immediate"

[[mounts]]
  source = "scans"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
