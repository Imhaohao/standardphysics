[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-api"
version = "0.1.0"
description = "Upload, pipeline jobs and the workspace API. Lane D."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "standardphysics-contracts",
  "standardphysics-fixtures",
  "standardphysics-pipeline",
  "standardphysics-agents",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
