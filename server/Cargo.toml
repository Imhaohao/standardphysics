[package]
name = "sp-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "sp_server"
path = "src/lib.rs"

[[bin]]
name = "sp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
aws-sdk-s3 = "1.152.0"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hex = "0.4.3"
jsonwebtoken = "9"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sp-core = { version = "0.1.0", path = "../core/sp-core" }

[dev-dependencies]
rsa = "0.9.10"
tokio-tungstenite = "0.26"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
