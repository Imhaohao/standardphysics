name: Web and contracts

on:
  push:
    paths:
      - "packages/contracts/**"
      - "apps/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  contracts:
    name: Generated types match the contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install pydantic==2.13.5 pydantic-core==2.46.5 -e packages/contracts
      - run: npm ci
        working-directory: apps/web
      - run: npm run contracts
        working-directory: apps/web
        env:
          PYTHON: python
      - name: Fail if a contract changed without regenerating
        run: git diff --exit-code -- apps/web/src/types/contracts.ts

  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
