[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-contracts"
version = "0.1.0"
description = "Shared types. Lane D owns this package; every other lane reads it."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_contracts"]
