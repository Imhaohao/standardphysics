[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-fixtures"
version = "0.1.0"
description = "A synthetic shop so every lane can build before the first real scan."
requires-python = ">=3.11"
dependencies = ["standardphysics-contracts", "pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_fixtures"]
